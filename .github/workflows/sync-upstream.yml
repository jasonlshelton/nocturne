# Keeps this fork's main = upstream nightscout/nocturne main + every in-flight branch of mine
# (anything under feat/ or fix/). Pushing main starts "Build and Publish with Aspire", which
# publishes ghcr.io/<owner>/nocturne/nocturne-{api,web}:latest.
#
# Lives only on the fork's main branch (never on a PR branch). Delete a branch once its PR is
# merged upstream and it drops out of the next sync.
#
# Needs a repository secret SYNC_TOKEN: a fine-grained personal access token for this
# repository with Contents: Read and write and Workflows: Read and write. The built-in
# GITHUB_TOKEN cannot push commits that touch .github/workflows/, which upstream changes
# regularly, and its pushes would not start the image build either.

name: Sync upstream and rebuild

on:
  schedule:
    - cron: "0 11 * * *" # daily, 04:00 Pacific (PDT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/nightscout/nocturne.git
  BRANCH_PREFIXES: "feat/ fix/"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream main and my branches
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD)

          git fetch --no-tags "$UPSTREAM" main
          git merge --no-edit FETCH_HEAD

          for prefix in $BRANCH_PREFIXES; do
            for ref in $(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/$prefix"); do
              echo "Merging $ref"
              git merge --no-edit "$ref"
            done
          done

          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A merge git reports as clean can still leave code that does not compile when upstream
      # changes the same methods a branch touches. Compile the API and its tests before anything
      # is pushed, so a bad merge fails here instead of shipping in the images. The full test
      # suite runs in the Tests workflow after the push.
      - name: Set up .NET
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Compile the merge
        if: steps.merge.outputs.changed == 'true'
        run: dotnet build tests/Unit/Nocturne.API.Tests/Nocturne.API.Tests.csproj -p:GenerateNSwagClient=false

      # Pushed with SYNC_TOKEN, so this push starts the image build on its own.
      - name: Push main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main
